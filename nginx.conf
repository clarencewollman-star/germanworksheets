server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    add_header Cache-Control "no-cache, must-revalidate" always;
    expires off;
    etag off;
    location /api/feedback/ {
        client_max_body_size 7m;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location = /admin { try_files /admin.html =404; }
    location = /admin/ { return 302 /admin; }
    location = /bingo { try_files /bingo-generator.html =404; }
    location = /bingo/ { return 302 /bingo; }
    location = /fibel { try_files /fibel.html =404; }
    location = /fibel/ { return 302 /fibel; }
    location /assets/generated/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /assets/release.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
