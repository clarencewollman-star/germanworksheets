<body>
<main data-word-worksheet="syllables">
  <h1 class="screen">Syllable Practice</h1>
  <section class="panel screen alphabet-controls">
    <label for="alphabet-text">Text for the worksheet</label>
    <textarea id="alphabet-text" rows="5" aria-describedby="alphabet-help" placeholder="Paste German text or a word list here"></textarea>
    <p id="alphabet-help" class="mt-2 mb-0">
      <span id="syllable-rewrite-help">Students rewrite each practice word with syllable breaks, like <span lang="de">Blu-men</span>.</span>
      <span id="syllable-sort-help" hidden>Students sort the words into columns for 1, 2, or 3 or more syllables.</span>
    </p>
    <div class="actions">
      <div>
        <label for="syllable-activity">Activity</label>
        <select id="syllable-activity">
          <option value="rewrite">Rewrite with syllable breaks</option>
          <option value="sort">Sort by syllable count</option>
        </select>
      </div>
      <div>
        <label for="alphabet-font">Font</label>
        <select id="alphabet-font">
          <option value="Arial">Arial (Print)</option>
          <option value="Fraktur">Fraktur</option>
          <option value="Hand">BW Hand Schrift</option>
          <option value="Handschrift">Handschrift</option>
        </select>
      </div>
      <label><input type="checkbox" id="alphabet-key"> Include answer key</label>
    </div>
    <div class="actions">
      <button type="button" id="alphabet-create" class="primary">Create worksheet</button>
      <button type="button" id="alphabet-save" disabled>Save PDF</button>
    </div>
    <p id="alphabet-status" role="status"></p>
  </section>
  <section id="alphabet-pages" class="alphabet-pages" aria-label="Worksheet preview"></section>
</main>
