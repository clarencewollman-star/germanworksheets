  <section class="panel converter-edit" aria-label="Text and settings">

    <textarea id="input" placeholder="Type or paste your text here" spellcheck="false"></textarea>
    <div class="converter-row">
      <div class="converter-field">
        <label for="font">Font</label>

      </div>

    <div>
      <details class="converter-details">
        <summary>Text options</summary>
        <div>
          <div class="converter-row">
            <div class="converter-field" id="alternate-font-control">
              <label for="alternate-font">Alternate fonts</label>
              <select id="alternate-font">
                <option value="off">Off</option>
                <option value="verse">Each verse</option>
                <option value="line">Each line break</option>
              </select>
            </div>
            <div class="converter-field" id="second-font-control" hidden>
              <label for="second-font">Second font</label>

                <option value="Fraktur">Fraktur</option>
                <option value="Hand">BW Hand Schrift</option>
                <option value="Handschrift">Handschrift</option>
              </select>
            </div>
          </div>
          <p id="font-pattern-hint" class="converter-note"></p>
          <div class="converter-checks">
            <label><input type="checkbox" id="split-syllables"> Add syllable hyphens (Mei-ne)</label>
            <label><input type="checkbox" id="red-vowels"> Color vowels red</label>
          </div>
        </div>
      </details>
      <details class="converter-details">
        <summary>Page layout</summary>
        <div>
          <div class="converter-row">
            <div class="converter-field">
              <label for="orientation">Orientation</label>
              <select id="orientation"><option>Portrait</option><option>Landscape</option></select>

            </div>
            <div class="converter-field">
              <label for="column-count">Columns</label>
              <select id="column-count"><option>1</option><option>2</option></select>
            </div>
          </div>
          <div class="converter-checks">
            <label><input type="checkbox" id="keep-verse" checked> Keep each verse together</label>
          </div>
        </div>
      </details>
      <details class="converter-details" id="font-tools">
        <summary>Font tools</summary>
        <div>
          <div class="converter-field">
            <label for="direction">Convert</label>
            <select id="direction">
              <option value="encode">German text to font text</option>
              <option value="decode">Font text to German text</option>
            </select>
          </div>
          <div class="converter-field mt-3">
            <label for="output">Converted text</label>
            <textarea id="output" spellcheck="false"></textarea>
          </div>
          <p id="hint" class="converter-note"></p>
          <div class="font-tools-actions">
            <button type="button" id="copy" disabled>Copy converted text</button>
            <a id="download-font" class="btn btn-outline-secondary" href="assets/MexMW-BWHandSchrift-LightDB.ttf" download>Download font</a>

          <p id="copy-status" class="converter-note" role="status"></p>
        </div>
      </details>

  <section aria-labelledby="preview-title">
    <div class="converter-preview-bar">
      <h2 id="preview-title">Page preview</h2>
      <div class="export-buttons">
        <button id="print-pages" class="primary" type="button" disabled>Save PDF</button>

      </div>
    </div>
    <p id="warning" class="converter-note" role="alert"></p>
    <p id="status" class="converter-note" role="status" aria-live="polite"></p>
    <div id="preview" aria-label="Converted text in the selected font"></div>
